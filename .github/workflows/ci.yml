name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix deliberately: the eCFR corpus is XML with non-ASCII
        # section symbols and em dashes, and encoding bugs only reproduce on a non-UTF-8
        # default locale, which is every stock Windows install.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # No neural extra: torch is ~2GB and the whole P0 story -- ingest, apparatus
        # stripping, bitemporal store, lexical retrieval, amendment benchmark, failure
        # budget -- is testable without it. `serve` is not optional here despite being an
        # extra: fastapi lives in it, so without it tests/test_api.py cannot even be
        # collected, and the API suite reported green by never running.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve,sources]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        # --cov=src/warrant, not --cov=warrant. The package-name form measures only modules
        # the tests happen to import, so every module at 0% is missing from the denominator
        # rather than counted against it: generate/model, eval/{run,stats,generation} and
        # observe/* vanished, and the run reported 82% where measuring the source tree
        # reports 59%. Before this commit the same gap read 80% against a true 58%.
        run: pytest -q --cov=src/warrant --cov-report=term-missing

  invariants:
    # The deterministic correctness gates from ARCHITECTURE.md section 9. Separated from the
    # unit suite so a failure here reads as "the system is wrong", not "a test broke".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/invariants -m ""

  gate:
    # Non-blocking on purpose. This job fetches from eCFR, a public government API, from a
    # shared runner IP -- and it just failed on an HTTP error from that API, not on anything
    # in this repository. A gate that goes red because someone else's server was busy trains
    # people to ignore red, which costs more than the signal is worth. It still reports.
    continue-on-error: true
    # The quality floor, on a schedule and on demand -- deliberately not on every push.
    #
    # It needs a built corpus, and building one is ~10 minutes of eCFR fetching against a
    # public API that owes this project nothing. Running that on every pull request would
    # make the slowest, most rate-limited step the one that gates the fastest feedback, and
    # would hammer a government endpoint for no added signal: the floor moves when retrieval
    # changes, not when a docstring does.
    #
    # So the unit suite and the invariants guard every push, and this guards the numbers the
    # README quotes. A regression caught within a day is caught; one nobody ever checks for
    # is the actual failure mode, and that is what this closes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,serve]"
      - name: Cache eCFR snapshots
        # Snapshots are immutable point-in-time history, so the key needs no date: a hit is
        # always valid and a miss only costs the fetch once. The index files that expire are
        # governed by corpus.index_ttl_hours, not by this.
        uses: actions/cache@v4
        with:
          path: data/ecfr
          key: ecfr-${{ hashFiles('configs/default.yaml') }}
      - run: make fetch
      - run: make build
      - name: Quality gate
        # --lexical, against its own recorded floor. There is no torch on this runner, and
        # the config hash cannot see that: the same configs/default.yaml with torch missing
        # hashes identically and is a different system. So each floor also records the model
        # set that produced it, and a mismatch reports *incomparable* rather than passing --
        # otherwise this job would grade a lexical run against a reranked floor and call the
        # cheaper, worse system green.
        run: |
          python -m warrant.cli eval gate -c configs/default.yaml --split test             --lexical --floor results/eval-floor-lexical.json

  image:
    # Builds the container, because the author's machine has no Docker and an unverified
    # Dockerfile is worse than none: a reviewer runs `docker build`, it fails, and every
    # other claim in the repository is suddenly worth less. This job is the verification.
    #
    # Lexical only. The neural image pulls ~2 GB of torch, which is minutes of runner time
    # on every push to prove a pip install line the `test` job already proves. DEPLOY.md
    # says the neural size is an estimate, and it stays one until someone needs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lexical
          load: true
          tags: warrant:lexical
      - name: Report the image size
        run: docker image ls warrant:lexical
      - name: The real schema builds in this base image
        # Not a hand-written FTS5 probe -- open the actual Store, which executes the actual
        # SCHEMA including chunk_fts (fts5) and chunk_vocab (fts5vocab). Debian almost
        # certainly ships both, but "almost certainly" is how a container reaches a reviewer
        # and dies on its first query. The first version of this step asserted it with a
        # hand-escaped SQL string and failed on its own quoting, which is a good argument for
        # running the code under test instead of a replica of it.
        run: >
          docker run --rm --entrypoint python warrant:lexical
          -c 'from warrant.index.store import Store; Store(":memory:"); print("schema ok")'
      - name: The container serves, and is honest about having no corpus
        # No corpus ships in the image, so /ready must say 503 while /health must not. That
        # asymmetry is the entire reason there are two probes, and it is worth asserting.
        run: |
          docker run -d --name w -p 8000:8000 warrant:lexical
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health > /dev/null && break
            sleep 2
          done
          curl -sf localhost:8000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)
          echo "ready returned $code"
          test "$code" = "503"
          docker logs w | tail -20
          docker rm -f w
