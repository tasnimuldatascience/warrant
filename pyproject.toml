[project]
name = "warrant"
version = "0.1.0"
description = "Applicability-aware temporal RAG over US federal HR regulation, with stage-level failure localization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Tasnimul Hasan" }]
keywords = ["rag", "retrieval", "temporal", "bitemporal", "evaluation", "ecfr"]

# Deliberately small, and everything installs from wheels on Linux/macOS/Windows with no
# C++ toolchain. A reviewer must be able to `pip install -e .` and reproduce the failure
# budget; the generation stack is an extra because it is a ~2GB download and the entire
# retrieval + autopsy story is measurable without it.
dependencies = [
    "httpx>=0.27",          # eCFR API client
    "lxml>=5.2",            # eCFR ships XML; regulatory apparatus needs a real parser
    "numpy>=1.26",
    "scipy>=1.11",
    "bm25s>=0.2",           # lexical index; no JVM, no server
    "PyStemmer>=2.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "tenacity>=8.3",        # retry/backoff against a public API
    "rich>=13.7",
]

[project.optional-dependencies]
# Dense retrieval + reranking + generation. Split out: torch is ~2GB and P0 (corpus,
# bitemporal store, lexical retrieval, amendment benchmark, retrieval autopsy) is fully
# testable without it.
neural = ["torch>=2.4", "sentence-transformers>=3.0", "transformers>=4.44"]
generate = ["llama-cpp-python>=0.3"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]
all = ["warrant[neural,generate,serve,dev]"]

[project.scripts]
warrant = "warrant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Neural and network tests are off by default so `pytest` on a fresh clone is fast and
# offline. Run them with `-m neural` / `-m network`.
addopts = "-q -m 'not neural and not network'"
markers = [
    "neural: requires torch/transformers and downloads model weights",
    "network: hits the live eCFR API",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
