# Default Warrant configuration.
#
# Every field that changes retrieval behaviour is hashed into the config hash recorded on
# each trace, so a stored answer can always be tied to the settings that produced it.

corpus:
  title: 5
  # Title 5 chapter I: the OPM parts carrying substantive HR policy. Parts with no version
  # history in the eCFR point-in-time window (331, 631) are excluded at survey time.
  parts: ["300", "315", "316", "317", "330", "335", "337", "351", "353", "410",
          "430", "432", "451", "511", "530", "531", "532", "534", "536", "550",
          "551", "575", "591", "610", "630", "890"]
  # eCFR /full/ returns 404 at the 2016-12-27 floor every part reports; 2017 is the real
  # start of the point-in-time corpus.
  history_floor: "2017-01-01"
  request_delay_s: 1.0          # public API; be polite
  cache_dir: "data/ecfr"
  # /full/ snapshots are immutable history and are cached forever. /titles.json and
  # /versions are the opposite: they are where an amendment published tomorrow first
  # becomes visible, so caching them with the same never-expire policy freezes the corpus --
  # the next fetch re-reads the pinned files, sees no new dates and downloads nothing, with
  # no error anywhere. Hence a TTL on those two only. `--refresh` bypasses it.
  index_ttl_hours: 24.0
  # How long a recorded 404 is believed. eCFR's issue date lags the calendar, so a 404 for a
  # recent date is publication lag, not absence; those are never recorded at all (see
  # issue_date_lag_days), and the rest are re-probed after this window.
  negative_cache_ttl_days: 30.0
  issue_date_lag_days: 30

store:
  path: "data/warrant.sqlite3"
  dense_path: "data/dense"
  human_benchmark: "benchmarks/human.yaml"
  budget: "results/failure-budget.json"
  traces: "data/traces.sqlite3"

diff:
  wholesale_threshold: 0.50     # similarity below this = section replaced, not amended
  min_changed_tokens: 3         # below this, treat as editorial noise

# Model weights: every `model` below has a `revision` beside it.
#
# A bare repo name resolves to whatever that repository's `main` points at on the day the
# weights are downloaded. Three repositories nobody here controls therefore sit underneath
# the published numbers, and if one of them re-trains or re-quantises, the scores in
# results/ change while every config hash stays identical -- so counterfactual replay would
# report that nothing changed about the only thing that did.
#
# null = current behaviour (track `main`). To pin, put the commit SHA from the repository's
# "Files and versions" tab, e.g.
#
#   revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
#
# A tag or branch name is accepted and is weaker: both can be moved.

index:
  dense:
    enabled: true               # set false to run the entire P0 path with no GPU
    model: "BAAI/bge-small-en-v1.5"
    revision: null
    batch_size: 64
  rerank:
    enabled: true               # set false to measure the pipeline without a cross-encoder
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    revision: null
  fusion:
    method: "rrf"
    k: 60

generate:
  # null = the default in warrant/generate/answer.py (Qwen/Qwen2.5-1.5B-Instruct). Naming
  # the same repo here as well is how the two come to disagree.
  model: null
  revision: null

retrieve:
  candidates_lexical: 100
  candidates_dense: 100
  # Widened from 30/8 on the evidence of the failure budget, not by taste. At 30/8 the
  # budget put 36.9% of failures on fusion and 33.1% on truncation -- two thirds of all
  # failures were evidence that had been found and then cut. See results/eval-002.
  rerank_top_k: 50
  final_k: 16
  # Excerpts handed to the generator. null = final_k, so widening retrieval widens context
  # instead of the two silently disagreeing.
  context_chunks: null
  # Which sources retrieval may draw from, and how weak an authority it may cite. Empty and
  # null mean everything in the store, which is right while the store holds only the
  # regulation. Once guidance is ingested, `max_authority: 2` is the setting to reach for:
  # statute is 1 and archival OCR is 5, so it reads "no weaker than regulation". A fact
  # sheet is written for readers rather than for lawyers, so it tends to use the asker's own
  # words -- which is exactly what makes it outrank the law it summarises.
  sources: []
  max_authority: null

eval:
  buckets: ["temporal", "generated", "human"]
  bootstrap_samples: 1000       # paired bootstrap for confidence intervals

# Non-eCFR sources. Every one is off by default.
#
# Federal HR law is a hierarchy, and reading only the regulation is reading the middle of an
# argument: the statute says what Congress required, the regulation how OPM implemented it,
# the notice why it changed, guidance how OPM says to read it, and the printed volume is the
# record of last resort. Authority is ordered (statute 1 .. archival 5) and stored on every
# chunk, so retrieval can refuse to let a fact sheet outrank the law it summarises.
#
# Off by default because each reaches a different public API, and a clone that fails on its
# first run because of a network it never asked to use is a clone nobody evaluates.
# `warrant corpus build` gives the full P0 corpus with none of these enabled;
# `warrant corpus ingest --source usc` is the opt-in.
sources:
  federal_register:            # authority 3 -- notices, and the reasoning behind amendments
    enabled: false
    cache_dir: "data/federal_register"
    parts: ["630"]             # the join to the eCFR corpus, by amended CFR part
    published_since: "2000-01-01"
    term: ""
    max_documents: 200
  usc:                         # authority 1 -- statute; binds hardest
    enabled: false
    cache_dir: "data/usc"
    title: "5"
    chapters: ["63"]           # leave: the statute behind 5 CFR 630
    sections: []
    # Empty discovers the current release point from the OLRC download page. A value like
    # "119-102" pins it, which is what makes an ingest reproducible; left open so a first
    # run works without looking anything up.
    release_point: ""
  opm:                         # authority 4 -- guidance; explains, does not bind
    enabled: false
    cache_dir: "data/opm"
    urls: []                   # empty uses sources.html.OPM_FACT_SHEETS
    ttl_hours: 24.0
  govinfo:                     # authority 5 -- archival scans, recovered by OCR
    enabled: false
    cache_dir: "data/govinfo"
    ocr: true
    # package/granule. Listed, not swept: a printed volume is 300 MB and this tier
    # corroborates a citation rather than supplying one.
    granules: []

# The NLI verifier. Off, with the number that decides it beside it -- the same discipline
# index.rerank follows.
#
# On real generator output it buys +2.3 points over span alignment at p=0.55: not
# measurable. What it does buy is a second channel: on claims flipped to contradict their
# evidence it is +49.1 (p=8.7e-07), because the span aligner finds a supporting span in all
# 22 of them. A contradiction shares more vocabulary with its premise than a real paraphrase
# does, so tuning the aligner never reaches it.
#
# The caveat that matters is the class breakdown, not the headline: macro accuracy on
# generator output is 60.1%, and half the generator's neutral pairs come back as entailment.
# 86.8% micro would have shipped a verifier that is 50% accurate on the cases it exists for.
# See results/eval-007-entailment.md.
entail:
  enabled: false
  model: "cross-encoder/nli-deberta-v3-base"
  revision: null
  batch_size: 16              # measured peak; 458 pairs/s on GPU, ~24 ms per answer
  temperature: 1.72           # fitted out-of-fold; ECE 9.45% -> 4.99%
