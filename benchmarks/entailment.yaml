# The eval-007 probe set: 182 hand-labelled (claim, evidence) pairs over 91 sections.
#
# Promoted here from the appendix of `results/eval-007-entailment.md`, where the labels
# lived only in a markdown table -- which made every headline number in that document a
# transcription. This repository has already carried one entailment claim ("71.3% on 148
# hand-labelled pairs") against a set that existed nowhere, and it survived review because
# nothing could check it. `warrant.eval.entailment` scores this file instead: the numbers
# move when the model, the corpus or a label moves, and nothing has to be retyped.
#
# Evidence is written `section#anchor` with the date the premise was read at, and resolved
# against the live store when the file loads -- the same contract `human.yaml` uses, and for
# the same reason: a hand-written version id rots on the next rebuild. An anchor that no
# longer resolves is an **error**, never a skipped item. A pair that silently stops being
# scored shrinks the set without moving the reported n, which is the failure this file
# exists to prevent.
#
# `as_of` is the resolved version's own `valid_from`: the one date guaranteed to select the
# version the labeller read, whether or not that paragraph has been amended since. Premises
# are the store's text, verbatim -- nothing here restates regulatory prose.
#
# Two strata, **never pooled into one headline**:
#
#   generator     129 pairs Qwen2.5-1.5B-Instruct actually emitted while answering the
#                 `human.yaml` questions over real retrieved context; `question` names the
#                 one that produced each claim, and 53 of the 56 questions produced at least
#                 one. This is the observed distribution, and its
#                 class balance -- 102 entail, 24 neutral, 3 contradict -- is the finding
#                 rather than a design: the generator copies its premise.
#   adversarial    53 author-written minimal edits of verbatim in-force chunks -- one
#                 modality flipped, one number changed, one deadline moved. Its balance is
#                 *chosen*, so it measures whether the contradiction channel works, never
#                 how often this generator trips it. Pooling the two would report a mixture
#                 whose weights nobody selected, and would hide that the model is near
#                 chance on the generator's neutrals.
#
# Labels are the author's, single-annotated: no second annotator, no agreement statistic.
# The rubric is under "Labelling rubric" in the results doc, stated so a reader can disagree
# with a named pair rather than with the number.

# --- generator: 129 pairs the model emitted --------------------------------------

