# --- questions this corpus cannot answer, from a scope mismatch --------------------
#
# The earlier "hard kinds" note in the header asked for questions the corpus cannot answer,
# and the honest way to write one turns out not to be an empty evidence list. `is_satisfied_by`
# treats an empty acceptable-evidence set as satisfied by *any* retrieved list -- that is the
# right behaviour for `scope-exclusion`, where the whole question is whether a part stayed out
# of the query, but it is the wrong behaviour here: it would grade a genuinely unanswerable
# item as trivially "sufficient" no matter what the system did, which is why
# `verify.calibrate.collect_examples` drops the `scope-exclusion` bucket outright rather than
# score it for abstention. That is a real gap in what this benchmark format can express, and
# it is recorded here rather than worked around with a construct that means something else.
#
# What is expressible, and just as real: a person who asks a question that a *different* part
# governs than the one their own pay system or service falls under. "How do I earn a
# within-grade increase" is a completely ordinary question -- it is just not one 5 CFR part 531
# answers for a Senior Executive, because part 531 is GS-only and the scope predicate removes
# it from the query before retrieval runs. The gold evidence below is real, in-force text; it
# is simply unreachable under the scope the item declares, which is what a correct system is
# supposed to discover and say so, rather than answer from a GS rule that does not govern the
# asker. Sufficiency on these items is enforced by the predicate, the same way the
# `scope-exclusion` bucket's distractor rate is -- the number worth reading off these items is
# not the aggregate sufficiency, it is what `warrant eval generation` does when the retrieved
# context is empty: does the model say so, or does it answer anyway from background knowledge
# about how GS within-grade increases work.

- id: wgi-not-applicable-ses
  query: How do I earn a within-grade increase?
  evidence: [["531.404#a"]]
  scope: {pay_system: SES}

