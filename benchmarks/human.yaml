# Hand-written questions for the `human` bucket.
#
# These are author-written, not collected from users, and the README says so. They exist to
# characterise what a realistic query looks like -- shorter than the regulation, phrased as a
# person would ask, using words the text may not contain -- not to rank configurations. At
# this size the confidence intervals will swallow any difference between retrieval configs,
# and reporting a winner from this bucket would be reporting noise.
#
# Evidence is written as `section#anchor` and resolved to the version in force on the item's
# date when the file is loaded. Writing version ids by hand would rot on the next rebuild,
# and a benchmark whose ground truth silently stops resolving is worse than no benchmark.
#
# `evidence` is a list of minimal sufficient sets: any one set is enough to answer.

