# --- part coverage --------------------------------------------------------------
#
# Everything above concentrates on 315, 351, 432, 531, 550 and their neighbors. The corpus
# holds 26 parts of 5 CFR chapter I; a bucket that only exercises appointments, RIF and pay
# for GS employees measures appointments, RIF and pay for GS employees, not "realistic
# queries" in general. What follows spreads deliberately into 300, 317, 330, 335, 337, 351,
# 353, 410, 430, 432, 451, 511, 530, 531, 532, 534, 536, 550, 551, 575, 591, 610, 630 and 890,
# and keeps writing the hard kinds throughout: date-dependent answers, scope-dependent
# answers, exception clauses (``except``/``unless``/``subject to``), answers split across two
# paragraphs, and questions this corpus cannot answer on its own terms.
#
# Each item below was written as a question first -- what a federal employee or an HR
# specialist would actually want to know -- and the evidence located afterward by reading the
# section, not the reverse. Paraphrasing a chunk into a question makes the query the document;
# that is not a query, and inflates sufficiency trivially.

